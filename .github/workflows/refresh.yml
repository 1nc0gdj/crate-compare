name: Daily refresh

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 7am in Sydney during daylight saving, 6am otherwise
  workflow_dispatch:        # adds a "Run workflow" button so you can start it by hand

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the two Python tools
        run: pip install -r requirements.txt

      - name: Set up the database (safe to repeat)
        run: python scraper.py init

      - name: Scrape every shop
        run: python scraper.py all
        timeout-minutes: 75

      - name: Show what each shop returned
        run: |
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect("crate.db")
          rows = con.execute("SELECT rt.name, COUNT(*), MAX(li.last_seen) FROM listings li JOIN retailers rt ON rt.id = li.retailer_id GROUP BY rt.name").fetchall()
          for name, n, last in rows:
              print(f"{name:<10} {n:>4} listings, last seen {last}")
          PY

      - name: Build the page
        run: |
          python build_site.py
          mkdir _site
          cp site.html _site/index.html

      - name: Save the database back to the repository
        run: |
          git config user.name "crate-compare bot"
          git config user.email "actions@users.noreply.github.com"
          git add crate.db rates.json
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
